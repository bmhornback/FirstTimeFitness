<!-- FirstTimeFitness v1.3.0 — https://github.com/bmhornback/FirstTimeFitness/blob/main/CHANGELOG.md -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="theme-color" content="#0f0f0f">
<title>Gym Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:#2e2e2e;
  --accent:#c8f04a;--accent-dim:rgba(200,240,74,0.12);--accent-text:#0f0f0f;
  --text:#f0f0f0;--text-muted:#888;--text-dim:#555;
  --upper:#4a9cf0;--upper-dim:rgba(74,156,240,0.12);
  --lower:#c8f04a;--lower-dim:rgba(200,240,74,0.12);
  --success:#4ac98a;--success-dim:rgba(74,201,138,0.12);
  --warn:#f0a84a;--warn-dim:rgba(240,168,74,0.12);
  --danger:#f0614a;--radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden}
body{display:flex;flex-direction:column;min-height:100vh}

/* NAV */
.bottom-nav{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);z-index:200;padding-bottom:env(safe-area-inset-bottom,0)}
.bnav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 3px 8px;cursor:pointer;border:none;background:transparent;color:var(--text-dim);font-family:'DM Sans',sans-serif;font-size:11px;gap:3px;transition:color 0.15s;min-width:0}
.bnav-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none}
.bnav-btn.active{color:var(--accent)}
.bnav-label{display:block;max-width:100%;line-height:1.1;text-align:center;white-space:normal;overflow-wrap:anywhere}

/* HEADER */
.app-header{background:var(--bg);padding:env(safe-area-inset-top,16px) 16px 0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.header-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px}
.app-title{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;color:var(--accent);letter-spacing:0.06em;text-transform:uppercase}
.date-chip{font-size:12px;color:var(--text-muted);font-family:'DM Mono',monospace}
.day-tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding-bottom:10px}
.dtab{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;transition:all 0.15s}
.dtab .ds{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;font-family:'DM Mono',monospace}
.dtab .dl{font-size:10px;font-weight:500;color:var(--text-muted);margin-top:2px}
.dtab.active-upper{background:var(--upper-dim);border-color:var(--upper)}
.dtab.active-upper .ds,.dtab.active-upper .dl{color:var(--upper)}
.dtab.active-lower{background:var(--lower-dim);border-color:var(--lower)}
.dtab.active-lower .ds,.dtab.active-lower .dl{color:var(--lower)}
.dtab.active-rest{background:rgba(136,136,136,0.1);border-color:#555}
.dtab.active-rest .ds,.dtab.active-rest .dl{color:#aaa}

/* CONTENT */
.page{flex:1;padding:16px;padding-bottom:24px;display:none}
.page.active{display:block}

/* SESSION */
.session-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.session-day{font-size:20px;font-weight:600;color:var(--text);line-height:1.2}
.session-focus{font-size:13px;color:var(--text-muted);margin-top:3px}
.type-badge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;letter-spacing:0.04em;font-family:'DM Mono',monospace;white-space:nowrap}
.badge-upper{background:var(--upper-dim);color:var(--upper);border:1px solid rgba(74,156,240,0.3)}
.badge-lower{background:var(--lower-dim);color:var(--lower);border:1px solid rgba(200,240,74,0.3)}
.badge-rest{background:rgba(136,136,136,0.1);color:#aaa;border:1px solid #444}

/* WARM UP CARD */
.warmup-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.warmup-title{font-size:12px;font-family:'DM Mono',monospace;color:var(--warn);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.warmup-title svg{width:13px;height:13px;stroke:var(--warn);fill:none;stroke-width:2}
.warmup-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.warmup-item{font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:5px}
.warmup-item svg{width:10px;height:10px;stroke:var(--accent);fill:none;stroke-width:2.5;flex-shrink:0}

/* COOL DOWN CARD */
.cooldown-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.cooldown-title{font-size:12px;font-family:'DM Mono',monospace;color:var(--success);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.cooldown-title svg{width:13px;height:13px;stroke:var(--success);fill:none;stroke-width:2}
.cooldown-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cooldown-item{font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:5px}
.cooldown-item svg{width:10px;height:10px;stroke:var(--success);fill:none;stroke-width:2.5;flex-shrink:0}
.cooldown-item-btn{width:100%;border:1px solid rgba(74,201,138,0.18);background:rgba(74,201,138,0.05);border-radius:var(--radius-sm);padding:7px 8px;text-align:left;cursor:pointer;font-family:'DM Sans',sans-serif}
.cooldown-item-btn .cooldown-link{margin-left:auto;font-size:10px;font-family:'DM Mono',monospace;color:var(--success);text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap}

/* PROGRESS */
.progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.progress-track{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.4s ease}
.progress-label{font-size:12px;font-family:'DM Mono',monospace;color:var(--text-muted);min-width:38px;text-align:right}

/* SECTION DIVIDER */
.section-divider{font-size:11px;font-family:'DM Mono',monospace;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.section-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* EXERCISE CARD */
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;transition:border-color 0.15s}
.ex-card.ex-complete{border-color:rgba(74,201,138,0.35)}
.ex-header{display:flex;align-items:center;padding:12px;cursor:pointer;gap:10px}
.ex-circle{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s}
.ex-circle.done{background:var(--success);border-color:var(--success)}
.ex-circle svg{width:10px;height:10px;stroke:#0f0f0f;stroke-width:3;fill:none;display:none}
.ex-circle.done svg{display:block}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:500;color:var(--text);line-height:1.2}
.ex-muscles{font-size:12px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.ex-sets-ct{font-size:11px;font-family:'DM Mono',monospace;color:var(--text-muted)}
.chev{width:14px;height:14px;stroke:var(--text-dim);stroke-width:2;fill:none;transition:transform 0.2s;flex-shrink:0}
.chev.open{transform:rotate(180deg)}

/* EXERCISE BODY */
.ex-body{border-top:1px solid var(--border);padding:12px}
.ex-body-head{display:flex;gap:10px;align-items:flex-start}
.ex-tip-wrap{flex:1;min-width:0}
.ex-exercise-img{width:88px;height:88px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);background:var(--surface2)}
.ex-tip{font-size:13px;color:var(--text-muted);line-height:1.6;background:var(--surface2);border-radius:var(--radius-sm);padding:9px 11px;margin-bottom:10px;border-left:2px solid var(--accent)}
.ex-cue{font-size:12px;font-family:'DM Mono',monospace;color:var(--accent);margin-bottom:10px;padding:6px 10px;background:var(--accent-dim);border-radius:var(--radius-sm)}
.ex-cue::before{content:'CUE → '}
.mistakes-toggle{font-size:12px;color:var(--text-dim);cursor:pointer;text-decoration:underline;text-underline-offset:2px;margin-bottom:10px;display:inline-block}
.mistakes-box{font-size:12px;color:var(--text-muted);background:rgba(240,97,74,0.06);border:1px solid rgba(240,97,74,0.2);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:10px;line-height:1.7;display:none}
.mistakes-box.open{display:block}
.target-label{font-size:11px;font-family:'DM Mono',monospace;color:var(--accent);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px}
.col-labels{display:grid;grid-template-columns:26px 1fr 1fr 36px;gap:5px;margin-bottom:4px;padding:0 1px}
.col-label{font-size:11px;font-family:'DM Mono',monospace;color:var(--text-dim);text-align:center;text-transform:uppercase;letter-spacing:0.03em}
.set-row{display:grid;grid-template-columns:26px 1fr 1fr 36px;gap:5px;align-items:center;margin-bottom:5px}
.set-num{font-size:12px;font-family:'DM Mono',monospace;color:var(--text-dim);text-align:center}
.set-input{width:100%;padding:7px 4px;font-size:15px;font-family:'DM Mono',monospace;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);text-align:center;-webkit-appearance:none;appearance:none}
.set-input:focus{outline:none;border-color:var(--accent)}
.set-input::placeholder{color:var(--text-dim)}
.set-tick{width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s}
.set-tick:active{transform:scale(0.9)}
.set-tick svg{width:13px;height:13px;stroke:var(--text-dim);stroke-width:2.5;fill:none}
.set-tick.done{background:var(--success-dim);border-color:var(--success)}
.set-tick.done svg{stroke:var(--success)}
.set-row.set-done .set-input{opacity:0.45}

/* CARDIO ROW */
.cardio-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px}
.cardio-info .cardio-name{font-size:14px;font-weight:500;color:var(--text)}
.cardio-info .cardio-desc{font-size:12px;color:var(--text-dim);margin-top:2px}
.cardio-check{width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;flex-shrink:0}
.cardio-check.done{background:var(--success-dim);border-color:var(--success)}
.cardio-check svg{width:13px;height:13px;stroke:var(--text-dim);stroke-width:2.5;fill:none}
.cardio-check.done svg{stroke:var(--success)}

/* REST PAGE */
.rest-screen{text-align:center;padding:32px 16px}
.rest-icon-lg{font-size:44px;margin-bottom:14px}
.rest-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:8px}
.rest-body{font-size:14px;color:var(--text-muted);line-height:1.75;max-width:300px;margin:0 auto 20px}
.rest-opts{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;text-align:left;max-width:300px;margin:0 auto}
.rest-opts-title{font-size:11px;font-family:'DM Mono',monospace;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px}
.rest-opt{font-size:14px;color:var(--text-muted);padding:4px 0;display:flex;align-items:center;gap:7px}
.rest-opt svg{width:11px;height:11px;stroke:var(--accent);fill:none;stroke-width:2.5;flex-shrink:0}

/* COMPLETE BANNER */
.complete-banner{background:var(--success-dim);border:1px solid rgba(74,201,138,0.3);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.complete-banner svg{width:18px;height:18px;stroke:var(--success);stroke-width:2;fill:none;flex-shrink:0}
.complete-banner p{font-size:14px;color:var(--success);line-height:1.5}

/* FINISH BTN */
.finish-btn{width:100%;padding:14px;border-radius:var(--radius);border:none;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:6px;transition:all 0.15s}
.finish-btn.ready{background:var(--accent);color:var(--accent-text)}
.finish-btn.ready:active{transform:scale(0.98)}
.finish-btn.done-state{background:var(--surface);color:var(--text-dim);border:1px solid var(--border);cursor:default}

/* GUIDE PAGE */
.guide-section{margin-bottom:20px}
.guide-section-title{font-size:11px;font-family:'DM Mono',monospace;color:var(--accent);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.guide-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
.guide-card-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.guide-card-title svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:2;flex-shrink:0}
.guide-card p{font-size:13px;color:var(--text-muted);line-height:1.7}
.guide-card ul{padding-left:0;list-style:none}
.guide-card ul li{font-size:13px;color:var(--text-muted);line-height:1.7;padding:2px 0;display:flex;align-items:flex-start;gap:6px}
.guide-card ul li::before{content:'→';color:var(--accent);font-size:12px;flex-shrink:0;margin-top:1px}
.muscles-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muscle-group{background:var(--surface2);border-radius:var(--radius-sm);padding:10px}
.muscle-group-name{font-size:12px;font-weight:600;color:var(--text);margin-bottom:4px;font-family:'DM Mono',monospace}
.muscle-group-sub{font-size:12px;color:var(--text-dim);margin-bottom:6px}
.muscle-list{font-size:12px;color:var(--text-muted);line-height:1.8}
.rep-table{width:100%;border-collapse:collapse}
.rep-table td{font-size:13px;padding:5px 0;color:var(--text-muted);vertical-align:top}
.rep-table td:first-child{color:var(--text);font-weight:500;padding-right:12px;white-space:nowrap}
.prog-steps{counter-reset:step}
.prog-step{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.prog-step-num{width:20px;height:20px;border-radius:50%;background:var(--accent-dim);border:1px solid rgba(200,240,74,0.3);display:flex;align-items:center;justify-content:center;font-size:11px;font-family:'DM Mono',monospace;color:var(--accent);flex-shrink:0;margin-top:1px}
.prog-step p{font-size:13px;color:var(--text-muted);line-height:1.6}
.sub-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.sub-card-header{padding:10px 12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.sub-card-title{font-size:14px;font-weight:500;color:var(--text)}
.sub-card-body{border-top:1px solid var(--border);padding:10px 12px;display:none}
.sub-card-body.open{display:block}
.sub-item{font-size:13px;color:var(--text-muted);padding:3px 0;display:flex;align-items:flex-start;gap:6px;line-height:1.6}
.sub-item::before{content:'↳';color:var(--text-dim);flex-shrink:0}
.alt-card{margin-top:10px}
.alt-source{font-size:11px;color:var(--text-dim);margin-top:3px;line-height:1.5}
.alt-source a,.alt-footnote a{color:var(--accent);text-decoration:none}
.alt-list{display:grid;gap:8px}
.alt-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 10px;display:flex;gap:10px;align-items:flex-start}
.alt-item-img{width:64px;height:64px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid var(--border)}
.alt-item-content{flex:1;min-width:0}
.alt-item-name{font-size:13px;font-weight:500;color:var(--text)}
.alt-item-meta{font-size:11px;font-family:'DM Mono',monospace;color:var(--accent);text-transform:uppercase;letter-spacing:0.04em;margin-top:4px}
.alt-item-note{font-size:12px;color:var(--text-muted);line-height:1.6;margin-top:5px}
.alt-footnote{font-size:11px;color:var(--text-dim);line-height:1.6;margin-top:8px}
.stretch-safety{font-size:12px;color:var(--warn);line-height:1.6;background:var(--warn-dim);border:1px solid rgba(240,168,74,0.3);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:8px}
.stretch-card{scroll-margin-top:78px;transition:box-shadow 0.2s,border-color 0.2s}
.stretch-card-focus{border-color:rgba(200,240,74,0.55);box-shadow:0 0 0 1px rgba(200,240,74,0.18)}
.stretch-card-head{display:flex;gap:10px;align-items:flex-start}
.stretch-thumb{width:88px;height:88px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);background:var(--surface2)}
.stretch-thumb-fallback{width:88px;height:88px;border-radius:8px;border:1px dashed #4a4a4a;background:var(--surface2);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:10px;color:var(--text-dim);line-height:1.4;flex-shrink:0}
.stretch-thumb-fallback.hidden{display:none}
.stretch-meta{font-size:11px;color:var(--accent);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.04em;margin-top:2px}
.stretch-detail{margin-top:10px}
.stretch-detail-title{font-size:12px;color:var(--text);font-weight:600;margin-bottom:4px}
.stretch-detail-body{font-size:12px;color:var(--text-muted);line-height:1.65}
.stretch-steps{padding-left:18px;margin-top:3px}
.stretch-steps li{margin-bottom:3px;color:var(--text-muted);font-size:12px;line-height:1.6}
.stretch-demo{display:inline-flex;margin-top:8px;font-size:11px;font-family:'DM Mono',monospace;color:var(--accent);text-decoration:none}

/* HISTORY PAGE */
.hist-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.hist-item{padding:12px 14px;border-bottom:1px solid var(--border)}
.hist-item:last-child{border-bottom:none}
.hist-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.hist-day-name{font-size:14px;font-weight:500;color:var(--text)}
.hist-date{font-size:12px;font-family:'DM Mono',monospace;color:var(--text-muted)}
.hist-sets{font-size:12px;color:var(--text-dim);line-height:1.7;white-space:pre-line}
.hist-empty{padding:32px;text-align:center;font-size:14px;color:var(--text-dim)}
.hist-clear{width:100%;padding:11px;border-radius:var(--radius);border:1px solid rgba(240,97,74,0.3);background:transparent;font-size:14px;color:var(--danger);font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.15s}
.hist-clear:active{background:rgba(240,97,74,0.1)}
.hist-page-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:4px}
.hist-page-sub{font-size:13px;color:var(--text-muted);margin-bottom:14px}

/* MINDSET */
.mindset-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px}
.mindset-q{font-size:14px;font-weight:500;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.mindset-q svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:2;flex-shrink:0}
.mindset-a{font-size:13px;color:var(--text-muted);line-height:1.7}
.checklist-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
.checklist-item:last-child{border-bottom:none}
.checklist-item svg{width:12px;height:12px;stroke:var(--accent);fill:none;stroke-width:2.5;flex-shrink:0;margin-top:2px}

/* EFFORT SELECTOR */
.effort-row{display:flex;align-items:center;gap:6px;margin-top:10px}
.effort-label{font-size:11px;font-family:'DM Mono',monospace;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;flex-shrink:0}
.effort-btn{flex:1;padding:5px 4px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);font-size:12px;font-family:'DM Mono',monospace;color:var(--text-dim);cursor:pointer;text-align:center;transition:all 0.15s}
.effort-btn.sel-easy{background:rgba(74,201,138,0.15);border-color:var(--success);color:var(--success)}
.effort-btn.sel-medium{background:rgba(240,168,74,0.15);border-color:var(--warn);color:var(--warn)}
.effort-btn.sel-hard{background:rgba(240,97,74,0.15);border-color:var(--danger);color:var(--danger)}

/* NEXT EXERCISE HIGHLIGHT */
.ex-card.ex-next{border-color:rgba(200,240,74,0.5);box-shadow:0 0 0 1px rgba(200,240,74,0.08)}

/* PROGRESSION HINT */
.prog-hint{font-size:11px;font-family:'DM Mono',monospace;padding:3px 7px;border-radius:99px;margin-top:3px;display:inline-flex;align-items:center;gap:4px}
.prog-hint.inc{background:rgba(74,201,138,0.12);color:var(--success);border:1px solid rgba(74,201,138,0.25)}
.prog-hint.rep{background:rgba(200,240,74,0.10);color:var(--accent);border:1px solid rgba(200,240,74,0.2)}

/* WEEKLY STATS */
.week-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.week-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;text-align:center}
.week-stat-val{font-size:20px;font-weight:600;color:var(--text);font-family:'DM Mono',monospace}
.week-stat-lbl{font-size:11px;color:var(--text-dim);margin-top:2px;text-transform:uppercase;letter-spacing:0.04em}

/* SESSION TIMER */
.session-timer{font-size:12px;font-family:'DM Mono',monospace;color:var(--text-muted);padding:3px 8px;background:var(--surface2);border-radius:99px;border:1px solid var(--border);white-space:nowrap;flex-shrink:0}

/* HIIT TIMER */
.hiit-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.hiit-presets{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
.hiit-preset{padding:7px 9px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text-muted);font-size:12px;font-family:'DM Mono',monospace;display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer}
.hiit-preset.active{border-color:rgba(200,240,74,0.45);background:var(--accent-dim);color:var(--accent)}
.hiit-fav{font-size:13px;line-height:1;opacity:0.8;cursor:pointer}
.hiit-fav.active{color:var(--warn);opacity:1}
.hiit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}

.hiit-field label{font-size:11px;font-family:'DM Mono',monospace;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em}
.hiit-field input{width:100%;padding:7px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-size:13px;font-family:'DM Mono',monospace;text-align:center}
.hiit-field input:focus{outline:none;border-color:var(--accent)}
.hiit-options{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0}

.hiit-countdown{font-size:30px;line-height:1;font-family:'DM Mono',monospace;color:var(--accent)}

.hiit-btn{padding:9px 8px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;font-family:'DM Mono',monospace;cursor:pointer}
.hiit-btn.primary{background:var(--accent);color:var(--accent-text);border-color:transparent}

/* SYNC BADGE */
.sync-badge{font-size:11px;font-family:'DM Mono',monospace;padding:3px 8px;border-radius:99px;background:rgba(74,201,138,0.12);color:var(--success);border:1px solid rgba(74,201,138,0.25);cursor:pointer;white-space:nowrap;flex-shrink:0}
.sync-badge.offline{background:rgba(136,136,136,0.08);color:var(--text-dim);border-color:var(--border)}

/* HOME WORKOUT PAGE */
.hw-intro{font-size:14px;color:var(--text-muted);line-height:1.65;margin-bottom:16px}
.hw-topline{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.hw-ref-badge{font-size:11px;font-family:'DM Mono',monospace;padding:4px 8px;border-radius:99px;background:rgba(74,156,240,0.12);color:var(--upper);border:1px solid rgba(74,156,240,0.28);white-space:nowrap}
.hw-note-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px;margin-bottom:16px}
.hw-note-title{font-size:11px;font-family:'DM Mono',monospace;color:var(--accent);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}

.hw-phase-header{display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px}
.hw-phase-title{font-size:12px;font-family:'DM Mono',monospace;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em}
.hw-phase-badge{font-size:11px;font-family:'DM Mono',monospace;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--text-dim);border:1px solid var(--border)}

.hw-detail-body{font-size:13px;color:var(--text-muted);line-height:1.65}

.hw-mistake-toggle{font-size:12px;color:var(--text-dim);cursor:pointer;text-decoration:underline;text-underline-offset:2px;display:inline-block;margin-bottom:8px}
.hw-mistake-box{font-size:12px;color:var(--text-muted);background:rgba(240,97,74,0.06);border:1px solid rgba(240,97,74,0.2);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:10px;line-height:1.7;display:none}

.hw-section-label{font-size:12px;font-weight:600;color:var(--text);margin-bottom:3px}
.hw-steps{padding-left:16px;margin:0}
.hw-steps li{font-size:13px;color:var(--text-muted);line-height:1.65;margin-bottom:3px}
.hw-phase-divider{display:flex;align-items:center;gap:8px;margin:20px 0 12px}
.hw-phase-divider::before,.hw-phase-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.hw-phase-divider-inner{font-size:11px;font-family:'DM Mono',monospace;color:var(--accent);text-transform:uppercase;letter-spacing:0.08em;white-space:nowrap;padding:3px 10px;border:1px solid rgba(200,240,74,0.3);border-radius:99px;background:var(--accent-dim)}

.hw-watch{font-size:13px;color:var(--success);background:var(--success-dim);border:1px solid rgba(74,201,138,0.25);border-radius:var(--radius-sm);padding:8px 10px;line-height:1.65}

@media (max-width:360px){
  .bnav-btn{font-size:10px;padding:8px 2px 7px}

  .hw-visual-row{flex-direction:column}
  .hw-thumb{width:100%;height:auto;max-height:140px}
}

/* AUTH OVERLAY */
.auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:360px}
.auth-logo{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;color:var(--accent);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.6}
.auth-input{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-family:'DM Sans',sans-serif;margin-bottom:10px;-webkit-appearance:none;appearance:none}
.auth-input:focus{outline:none;border-color:var(--accent)}
.auth-btn{width:100%;padding:12px;border-radius:var(--radius-sm);border:none;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;margin-bottom:8px;transition:all 0.15s}
.auth-btn.primary{background:var(--accent);color:var(--accent-text)}
.auth-btn.secondary{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.auth-btn:active{transform:scale(0.98)}
.auth-divider{text-align:center;font-size:12px;color:var(--text-dim);margin:4px 0 8px}
.auth-error{font-size:13px;color:var(--danger);margin-bottom:10px;padding:8px 10px;background:rgba(240,97,74,0.08);border-radius:var(--radius-sm);border:1px solid rgba(240,97,74,0.2);display:none}
.auth-error.visible{display:block}
.auth-msg{font-size:13px;color:var(--success);margin-bottom:10px;padding:8px 10px;background:var(--success-dim);border-radius:var(--radius-sm);border:1px solid rgba(74,201,138,0.3);display:none}
.auth-msg.visible{display:block}
</style>

<body>

<header class="app-header">
  <div class="header-row">
    <div class="app-title">Gym Tracker</div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="date-chip" id="date-chip"></div>
      <div class="sync-badge offline" id="sync-badge" onclick="showAuthMenu()" title="Sync status">☁ offline</div>
    </div>
  </div>
  <div class="day-tabs" id="day-tabs"></div>
</header>

<div id="page-workout" class="page active"></div>
<div id="page-guide" class="page"></div>
<div id="page-history" class="page"></div>

<nav class="bottom-nav">
  <button class="bnav-btn active" id="btn-workout" onclick="switchPage('workout')">
    <svg viewBox="0 0 24 24"><rect x="2" y="9" width="4" height="6" rx="1"/><rect x="18" y="9" width="4" height="6" rx="1"/><rect x="6" y="7" width="12" height="10" rx="1"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
    <span class="bnav-label">Workout</span>
  </button>
  <button class="bnav-btn" id="btn-guide" onclick="switchPage('guide')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.5" fill="currentColor"/></svg>
    <span class="bnav-label">Guide</span>
  </button>

    <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 2.5-1.3 4.7-3.3 6L14 21H10l-1.7-6C6.3 13.7 5 11.5 5 9a7 7 0 0 1 7-7z"/></svg>
    <span class="bnav-label">Mindset</span>
  </button>
  <button class="bnav-btn" id="btn-home" onclick="switchPage('home')">
    <svg viewBox="0 0 24 24"><path d="M3 12L12 3l9 9"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-5h4v5h4a1 1 0 0 0 1-1v-9"/></svg>
    <span class="bnav-label">At Home</span>

<div id="auth-overlay" style="display:none">
  <div class="auth-overlay">
    <div class="auth-card">
      <div class="auth-logo">Gym Tracker</div>
      <div class="auth-sub">Sign in to sync your workouts across devices and keep your history safe in the cloud.</div>
      <div class="auth-error" id="auth-error"></div>
      <div class="auth-msg" id="auth-msg"></div>
      <input class="auth-input" type="email" id="auth-email" placeholder="Email address" autocomplete="email"/>
      <input class="auth-input" type="password" id="auth-password" placeholder="Password (min 6 chars)" autocomplete="current-password"/>
      <button class="auth-btn primary" onclick="authSignIn()">Sign in</button>
      <div class="auth-divider">— or —</div>
      <button class="auth-btn secondary" onclick="authSignUp()">Create account</button>
      <div class="auth-divider"></div>
      <button class="auth-btn secondary" onclick="authSkip()">Continue without account</button>
    </div>
  </div>

<script>
// ─── SUPABASE CONFIG ──────────────────────────────────────────────────────────
// Replace these with your Supabase project URL and anon key.
// Get them from: https://app.supabase.com → Project Settings → API
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

let sb = null;        // Supabase client
let currentUser = null;

function initSupabase() {
  if (SUPABASE_URL === 'YOUR_SUPABASE_URL' || SUPABASE_ANON_KEY === 'YOUR_SUPABASE_ANON_KEY' || !window.supabase) return;
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

// ─── AUTH ─────────────────────────────────────────────────────────────────────
async function authSignIn() {
  if (!sb) { showAuthError('Supabase not configured. See SUPABASE_URL in the source.'); return; }
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  showAuthError('');
  if (!email || !password) { showAuthError('Please enter your email and password.'); return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { showAuthError(error.message); return; }
  await onSignedIn(data.user);
}

async function authSignUp() {
  if (!sb) { showAuthError('Supabase not configured. See SUPABASE_URL in the source.'); return; }
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  showAuthError('');
  if (!email || !password) { showAuthError('Please enter your email and password.'); return; }
  if (password.length < 6) { showAuthError('Password must be at least 6 characters.'); return; }
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { showAuthError(error.message); return; }
  if (data.user && !data.user.confirmed_at && !data.user.email_confirmed_at) {
    showAuthMsg('Check your email to confirm your account, then sign in.');
    return;
  }
  await onSignedIn(data.user);
}

function authSkip() {
  document.getElementById('auth-overlay').style.display = 'none';
  updateSyncBadge();
}

async function authSignOut() {
  if (sb) await sb.auth.signOut();
  currentUser = null;
  updateSyncBadge();
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  if (!el) return;
  el.textContent = msg;
  el.classList.toggle('visible', !!msg);
}

function showAuthMsg(msg) {
  const el = document.getElementById('auth-msg');
  if (!el) return;
  el.textContent = msg;
  el.classList.toggle('visible', !!msg);
}

function showAuthOverlay() {
  showAuthError('');
  showAuthMsg('');
  document.getElementById('auth-overlay').style.display = 'block';
}

async function onSignedIn(user) {
  currentUser = user;
  document.getElementById('auth-overlay').style.display = 'none';
  updateSyncBadge();
  await loadFromSupabase();
}

function updateSyncBadge() {
  const el = document.getElementById('sync-badge');
  if (!el) return;
  if (currentUser) {
    el.textContent = '⟳ synced';
    el.className = 'sync-badge';
    el.title = currentUser.email + ' — tap to sign out';
  } else {
    el.textContent = '☁ offline';
    el.className = 'sync-badge offline';
    el.title = 'Not signed in — tap to sign in';
  }
}

function showAuthMenu() {
  if (currentUser) {
    if (confirm('Signed in as ' + currentUser.email + '\n\nSign out?')) {
      authSignOut();
    }
  } else {
    showAuthOverlay();
  }
}

// ─── SUPABASE SYNC ────────────────────────────────────────────────────────────
async function syncHistoryEntryToCloud(entry) {
  if (!sb || !currentUser) return;
  try {
    const { error } = await sb.from('workout_history').insert({
      user_id: currentUser.id,
      date: entry.date,
      ts: entry.ts,
      day: entry.day,
      day_idx: entry.dayIdx,
      detail: entry.detail,
    });
    if (error) console.warn('Supabase history sync failed:', error.message);
  } catch (e) { console.warn('Supabase history sync failed:', e); }
}

async function syncProgToCloud() {
  if (!sb || !currentUser) return;
  try {
    const rows = Object.entries(progData).map(([idx, data]) => ({
      user_id: currentUser.id,
      day_idx: parseInt(idx),
      exercise_data: data,
      updated_at: new Date().toISOString(),
    }));
    if (rows.length > 0) {
      const { error } = await sb.from('progression_data').upsert(rows, { onConflict: 'user_id,day_idx' });
      if (error) console.warn('Supabase prog sync failed:', error.message);
    }
  } catch (e) { console.warn('Supabase prog sync failed:', e); }
}

async function loadFromSupabase() {
  if (!sb || !currentUser) return;
  try {
    // Fetch cloud workout history
    const { data: cloudHistory, error: historyError } = await sb
      .from('workout_history')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('ts', { ascending: true });

    if (historyError) {
      console.warn('Supabase history load failed:', historyError.message);
    } else if (cloudHistory) {
      const cloudTs = new Set(cloudHistory.map(h => h.ts));
      const localTs = new Set(history.map(h => h.ts));

      // Merge cloud records into local
      const newFromCloud = cloudHistory
        .filter(h => !localTs.has(h.ts))
        .map(h => ({ date: h.date, ts: h.ts, day: h.day, dayIdx: h.day_idx, detail: h.detail }));
      if (newFromCloud.length > 0) {
        history = [...history, ...newFromCloud].sort((a, b) => (a.ts || 0) - (b.ts || 0));
        save('gymHistory_v3', history);
      }

      // Upload any local records not yet in cloud (skip legacy entries without a ts)
      for (const entry of history) {
        if (entry.ts == null) continue;
        if (!cloudTs.has(entry.ts)) await syncHistoryEntryToCloud(entry);
      }
    }

    // Fetch cloud progression data
    const { data: cloudProg, error: progError } = await sb
      .from('progression_data')
      .select('*')
      .eq('user_id', currentUser.id);
    if (progError) {
      console.warn('Supabase prog load failed:', progError.message);
    } else if (cloudProg && cloudProg.length > 0) {
      cloudProg.forEach(row => { progData[row.day_idx] = row.exercise_data; });
      save('gymProg_v1', progData);
    } else {
      await syncProgToCloud();
    }
  } catch (e) { console.warn('Supabase load failed:', e); }

  if (activePage === 'history') renderHistory();
  renderWorkout();
}

async function clearHistoryFromCloud() {
  if (!sb || !currentUser) return;
  try {
    const { error: histError } = await sb.from('workout_history').delete().eq('user_id', currentUser.id);
    if (histError) console.warn('Supabase clear history failed:', histError.message);
    const { error: progError } = await sb.from('progression_data').delete().eq('user_id', currentUser.id);
    if (progError) console.warn('Supabase clear progression failed:', progError.message);
  } catch (e) { console.warn('Supabase clear history failed:', e); }
}

function makeStretchThumb(title, accent){
  const safeTitle=String(title).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const safeAccent=accent||'#4ac98a';
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="176" height="176" viewBox="0 0 176 176">
    <rect width="176" height="176" rx="16" fill="#1f1f1f"/>
    <rect x="10" y="10" width="156" height="156" rx="12" fill="#252525" stroke="#353535"/>
    <circle cx="88" cy="46" r="10" fill="none" stroke="${safeAccent}" stroke-width="5"/>
    <path d="M88 58v34m0 0 26 22M88 92l-26 22m26-18 24-22m-24 22-24-22" fill="none" stroke="${safeAccent}" stroke-linecap="round" stroke-width="5"/>

function safeSvgText(value){
  return String(value).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

function splitThumbLabel(text){
  const words=String(text).split(' ');
  if(words.length===1) return [words[0], ''];
  let first='', second='';
  words.forEach(word=>{
    if((first+' '+word).trim().length<=14 || !first) first=(first+' '+word).trim();
    else second=(second+' '+word).trim();
  });
  return [first, second.length>16 ? second.slice(0,15)+'…' : second];
}

function homePoseType(ex){
  const text=`${ex.name} ${ex.how}`.toLowerCase();
  if(text.includes('side plank')) return 'sideplank';
  if(text.includes('plank')) return 'plank';
  if(text.includes('hands and knees') || text.includes('cat-cow') || text.includes('downward dog')) return 'handsknees';
  if(text.includes('child\'s pose')) return 'childpose';
  if(text.includes('sit-up') || text.includes('crunch') || text.includes('dead bug') || text.includes('hollow')) return 'supine';
  if(text.includes('bridge')) return 'bridge';
  if(text.includes('pushup') || text.includes('dip')) return 'pushup';
  if(text.includes('lunge') || text.includes('warrior')) return 'lunge';
  if(text.includes('single-leg') || text.includes('one leg')) return 'singleleg';
  if(text.includes('jump') || text.includes('hop') || text.includes('skip')) return 'jump';
  if(text.includes('sprint') || text.includes('run')) return 'run';
  if(text.includes('stairs') || text.includes('step-up') || text.includes('box')) return 'stairs';
  return 'stand';
}

function makeHomeThumb(ex){
  const accentBySection={warmup:'#f0a84a',power:'#c8f04a',strength:'#4a9cf0',conditioning:'#f0614a',mobility:'#4ac98a'};
  const accent=accentBySection[(ex.section||'').toLowerCase()]||'#c8f04a';
  const [line1,line2]=splitThumbLabel(ex.name);
  const pose=homePoseType(ex);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="184" height="184" viewBox="0 0 184 184">
    <rect width="184" height="184" rx="18" fill="#1f1f1f"/>
    <rect x="10" y="10" width="164" height="164" rx="14" fill="#252525" stroke="#353535"/>
    <text x="92" y="24" text-anchor="middle" font-family="DM Mono, monospace" font-size="10" fill="${accent}" letter-spacing="0.9">${safeSvgText((ex.section||'Reference').toUpperCase())}</text>
    ${homePoseSvg(pose, accent)}
    <text x="92" y="145" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#e7e7e7">${safeSvgText(line1)}</text>
    ${line2 ? `<text x="92" y="159" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#e7e7e7">${safeSvgText(line2)}</text>` : ''}
    <text x="92" y="174" text-anchor="middle" font-family="DM Mono, monospace" font-size="9" fill="#8f8f8f">Reference diagram</text>

  return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
}

function makeHomeDemoUrl(name){

function parseHomeHowSteps(how){
  if(Array.isArray(how)) return how;
  const parts=String(how)
    .split(/\.\s+|,\s+(?=(?:[A-Z]|[0-9]|push|pull|repeat|hold|step|drive|lower|lift|keep|walk|run|swing|start|face|place|bend|hinge|sit|stand|lie|kneel|sprint|skip|exhale|inhale|return|lean|curl|rotate|explode|land|use|grab|tuck|shift|straighten|press|drop))/i)
    .map(step=>step.trim().replace(/\.$/,''))
    .filter(Boolean);
  return parts.length ? parts : [String(how)];
}

  const n = parseInt(v,10);
  if(Number.isNaN(n)) return def;
  return Math.min(max,Math.max(min,n));
}

function formatSecs(total){
  const s = Math.max(0,Math.floor(total||0));
  const m = Math.floor(s/60);
  const rs = s%60;
  return m+':'+(rs<10?'0':'')+rs;
}
function currentHiitPhase(){return hiitTimer.phases[hiitTimer.phaseIndex]||null;}
function hiitPhaseLabel(type){
  if(type==='warmup') return 'Warm-up';
  if(type==='work') return 'Work';
  if(type==='rest') return 'Rest';
  if(type==='cooldown') return 'Cooldown';
  return 'Ready';
}
function buildHiitPhases(cfg){
  const phases=[];
  if(cfg.warmup>0) phases.push({type:'warmup',seconds:cfg.warmup,round:0,totalRounds:cfg.rounds});
  for(let i=1;i<=cfg.rounds;i++){
    phases.push({type:'work',seconds:cfg.work,round:i,totalRounds:cfg.rounds});
    if(i<cfg.rounds&&cfg.rest>0) phases.push({type:'rest',seconds:cfg.rest,round:i,totalRounds:cfg.rounds});
  }
  if(cfg.cooldown>0) phases.push({type:'cooldown',seconds:cfg.cooldown,round:cfg.rounds,totalRounds:cfg.rounds});
  return phases;
}
function playHiitBeep(){
  try{
    const AC = window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    if(!hiitAudioCtx) hiitAudioCtx = new AC();
    const osc = hiitAudioCtx.createOscillator();
    const gain = hiitAudioCtx.createGain();
    osc.type='sine';
    osc.frequency.value=820;
    gain.gain.value=0.001;
    osc.connect(gain);
    gain.connect(hiitAudioCtx.destination);
    const now = hiitAudioCtx.currentTime;
    gain.gain.exponentialRampToValueAtTime(0.08, now+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now+0.18);
    osc.start(now);
    osc.stop(now+0.2);
  }catch{}
}
function fireHiitCue(msg){
  if(hiitState.soundCue) playHiitBeep();
  if(hiitState.vibrateCue&&navigator.vibrate) navigator.vibrate([100,50,100]);
  if(hiitState.voiceCue&&window.speechSynthesis){
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(msg);
      u.rate=1;
      window.speechSynthesis.speak(u);
    }catch{}
  }
  hiitTimer.lastCue = hiitState.textCue ? msg : '';
}
function clearHiitInterval(){
  if(hiitTimer.interval){clearInterval(hiitTimer.interval);hiitTimer.interval=null;}
}
function startCurrentHiitPhase(withCue){
  const phase=currentHiitPhase();
  if(!phase) return;
  if(withCue) fireHiitCue(hiitPhaseLabel(phase.type));
  hiitTimer.running=true;
  hiitTimer.awaiting=false;
  hiitTimer.phaseEndMs=Date.now()+Math.max(1,hiitTimer.remainingSec)*1000;
  clearHiitInterval();
  hiitTimer.interval=setInterval(tickHiit,250);
  tickHiit();
}
function advanceHiitPhase(){
  clearHiitInterval();
  hiitTimer.running=false;
  hiitTimer.awaiting=false;
  const next = hiitTimer.phaseIndex+1;
  if(next>=hiitTimer.phases.length){
    hiitTimer.remainingSec=0;
    fireHiitCue('Complete');
    hiitRefreshUI();
    return;
  }
  hiitTimer.phaseIndex=next;
  hiitTimer.remainingSec=currentHiitPhase().seconds;
  if(hiitConfig().autoStart){
    startCurrentHiitPhase(true);
  }else{
    hiitTimer.awaiting=true;
    fireHiitCue('Next: '+hiitPhaseLabel(currentHiitPhase().type));
    hiitRefreshUI();
  }
}
function tickHiit(){
  if(!hiitTimer.running) return;
  const leftMs=hiitTimer.phaseEndMs-Date.now();
  hiitTimer.remainingSec=Math.max(0,Math.ceil(leftMs/1000));
  if(leftMs<=0){advanceHiitPhase();return;}
  hiitRefreshUI();
}
function startHiit(){
  if(hiitTimer.running) return;
  if(hiitTimer.awaiting){startCurrentHiitPhase(false);return;}
  const done = hiitTimer.phases.length>0&&!hiitTimer.running&&!hiitTimer.awaiting&&hiitTimer.remainingSec===0;
  if(hiitTimer.phases.length===0||done){
    hiitTimer.phases=buildHiitPhases(hiitConfig());
    hiitTimer.phaseIndex=0;
    if(!hiitTimer.phases.length){hiitRefreshUI();return;}
    hiitTimer.remainingSec=hiitTimer.phases[0].seconds;
  }
  startCurrentHiitPhase(true);
}
function pauseHiit(){
  if(!hiitTimer.running) return;
  hiitTimer.remainingSec=Math.max(0,Math.ceil((hiitTimer.phaseEndMs-Date.now())/1000));
  hiitTimer.running=false;
  clearHiitInterval();
  hiitRefreshUI();
}
function skipHiitPhase(){
  if(!hiitTimer.phases.length) return;
  advanceHiitPhase();
}
function resetHiit(){
  clearHiitInterval();
  hiitTimer={phases:[],phaseIndex:0,remainingSec:0,running:false,awaiting:false,interval:null,phaseEndMs:0,lastCue:'Ready to start'};
  hiitRefreshUI();
}
function hiitStatusText(){
  const done = hiitTimer.phases.length>0&&!hiitTimer.running&&!hiitTimer.awaiting&&hiitTimer.remainingSec===0;
  if(hiitTimer.running) return 'Running';
  if(hiitTimer.awaiting) return 'Ready for next';
  if(done) return 'Complete';
  if(hiitTimer.phases.length&&hiitTimer.remainingSec>0) return 'Paused';
  return 'Ready';
}
function hiitRoundText(phase){
  if(!phase) return 'Round —';
  if(phase.type==='work'||phase.type==='rest') return `Round ${phase.round}/${phase.totalRounds}`;
  if(phase.type==='warmup') return `Warm-up before ${phase.totalRounds} rounds`;
  if(phase.type==='cooldown') return 'Cooldown';
  return 'Round —';
}
function hiitRefreshUI(){
  const phase=currentHiitPhase();
  const elCountdown=document.getElementById('hiit-countdown');
  const elPhase=document.getElementById('hiit-phase');
  const elRound=document.getElementById('hiit-round');
  const elStatus=document.getElementById('hiit-status');
  const elCue=document.getElementById('hiit-cue');
  const primary=document.getElementById('hiit-primary-btn');
  if(elCountdown){
    const fallback=hiitConfig().work;
    const show=hiitTimer.phases.length?hiitTimer.remainingSec:fallback;
    elCountdown.textContent=formatSecs(show);
  }
  if(elPhase) elPhase.textContent=phase?hiitPhaseLabel(phase.type):'Ready';
  if(elRound) elRound.textContent=hiitRoundText(phase);
  if(elStatus) elStatus.textContent=hiitStatusText();
  if(elCue) elCue.textContent=hiitTimer.lastCue||'';
  if(primary){
    let txt='Start HIIT';
    if(hiitTimer.running) txt='Pause';
    else if(hiitTimer.awaiting) txt='Start next';
    else if(hiitTimer.phases.length&&hiitTimer.remainingSec>0) txt='Resume';
    primary.textContent=txt;
  }
}
function hiitPrimaryAction(){
  if(hiitTimer.running) pauseHiit();
  else startHiit();
}
function setHiitPreset(id){
  const p = HIIT_PRESETS.find(x=>x.id===id);
  if(!p) return;
  hiitState.selectedPreset=id;
  hiitState.work=p.work;

  hiitState.rounds=p.rounds;
  saveHiitState();

}
function toggleHiitFavorite(id,e){
  if(e) e.stopPropagation();
  hiitState.favorites=hiitState.favorites||{};

}
function updateHiitField(field,val){
  hiitState[field]=clampInt(val,field==='rounds'?1:0,field==='rounds'?50:600,hiitState[field]);
  hiitState.selectedPreset='custom';

}
function toggleHiitOption(field){
  hiitState[field]=!hiitState[field];
  saveHiitState();

}

let timerStart = null;
let timerInterval = null;
function startTimer(){
  if(timerStart) return;
  timerStart = Date.now();
  timerInterval = setInterval(()=>{
    const el = document.getElementById('session-timer');
    if(!el) return;
    const s = Math.floor((Date.now()-timerStart)/1000);
    el.textContent = Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
  }, 1000);
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function todayIdx(){const d=new Date().getDay();return d===0?6:d-1;}
function initSession(i){
  if(session[i]) return;
  const day=DAYS[i];
  if(day.type==='rest') return;
  session[i]=day.exercises.map(ex=>({effort:'',sets:Array.from({length:ex.sets},()=>({w:'',r:'',done:false}))}));
}
function parseTargetTop(target){
  const m=target.match(/(\d+)[–\-](\d+)/);
  if(m) return parseInt(m[2]);
  const m2=target.match(/(\d+)\s*reps?/i);
  if(m2) return parseInt(m2[1]);
  return null;
}
function stretchNameFromLabel(label){
  return String(label||'').split(' · ')[0].trim();
}
function stretchGuideId(name){
  return `stretch-guide-${String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}`;
}
function calcProg(i){
  if(!session[i]) return {done:0,total:0};
  let done=0,total=0;
  session[i].forEach(ex=>ex.sets.forEach(s=>{total++;if(s.done)done++;}));
  if(cardioState[i]) done++;
  const day=DAYS[i];
  if(day.cardio) total++;
  return {done,total};
}
function checkSVG(){return`<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.8"><polyline points="2,7 5.5,11 12,3"/></svg>`;}
function chevSVG(open){return`<svg class="chev${open?' open':''}" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2,5 7,9 12,5"/></svg>`;}
function handleStretchImageError(img){
  if(!img) return;
  img.style.display='none';
  const fallback=img.nextElementSibling;
  if(fallback) fallback.classList.remove('hidden');
}
function handleExerciseImageError(img){
  if(!img) return;
  img.style.display='none';
}
function openStretchGuide(stretchName){
  switchPage('guide');
  setTimeout(()=>{
    const card=document.getElementById(stretchGuideId(stretchName));
    if(!card) return;
    card.scrollIntoView({behavior:'smooth',block:'start'});
    card.classList.add('stretch-card-focus');
    setTimeout(()=>card.classList.remove('stretch-card-focus'),1600);
  },30);
}

// ─── WORKOUT PAGE ─────────────────────────────────────────────────────────────
function renderWorkout(){
  const day=DAYS[activeDay];
  const main=document.getElementById('page-workout');
  document.getElementById('date-chip').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

  if(day.type==='rest'){
    const opts=day.restOpts.map(o=>`<div class="rest-opt"><svg viewBox="0 0 10 10"><polyline points="1,5 4,8 9,2"/></svg>${o}</div>`).join('');
    main.innerHTML=`<div class="rest-screen">
      <div class="rest-icon-lg">${day.restIcon}</div>
      <div class="rest-title">${day.restTitle}</div>
      <div class="rest-body">${day.restBody}</div>
      <div class="rest-opts"><div class="rest-opts-title">Good options today</div>${opts}</div>
    </div>${renderHiitCard()}`;
    hiitRefreshUI();
    return;
  }

  initSession(activeDay);
  const {done,total}=calcProg(activeDay);
  const pct=total>0?Math.round(done/total*100):0;
  const allDone=done===total&&total>0;

  // Find first incomplete exercise index for "next up" highlight
  let nextExIdx=-1;
  if(!allDone && session[activeDay]){
    nextExIdx=session[activeDay].findIndex(ex=>ex.sets.some(s=>!s.done));
  }

  let html='';

  // Header
  html+=`<div class="session-row">
    <div>
      <div class="session-day">${day.short} — ${day.label} body</div>
      <div class="session-focus">${day.focus}</div>
    </div>
    <span class="type-badge badge-${day.type}">${day.type.toUpperCase()}</span>
  </div>`;

  // Progress + timer
  html+=`<div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">${done}/${total}</div>
    <span class="session-timer" id="session-timer">${timerStart?Math.floor((Date.now()-timerStart)/60000)+':'+(Math.floor((Date.now()-timerStart)/1000)%60<10?'0':'')+Math.floor((Date.now()-timerStart)/1000)%60:'0:00'}</span>
  </div>`;

  html+=renderHiitCard();

  // Warmup
  const wuItems=day.warmup.map(w=>`<div class="warmup-item"><svg viewBox="0 0 10 10"><polyline points="1,5 4,8 9,2"/></svg>${w}</div>`).join('');
  html+=`<div class="warmup-card">
    <div class="warmup-title"><svg viewBox="0 0 14 14"><path d="M7 1v3M7 10v3M1 7h3M10 7h3M3 3l2 2M9 9l2 2M3 11l2-2M9 5l2-2"/></svg>Warm-up first</div>
    <div class="warmup-grid">${wuItems}</div>
  </div>`;

  if(allDone){
    html+=`<div class="complete-banner"><svg viewBox="0 0 20 20"><polyline points="3,10 8,16 17,4"/></svg><p>Session complete! Great work — saved to history.</p></div>`;
  }

  // Exercises
  html+=`<div class="section-divider">Exercises</div>`;

  day.exercises.forEach((ex,ei)=>{
    const exData=session[activeDay][ei];
    const exDone=exData.sets.filter(s=>s.done).length;
    const isComplete=exDone===ex.sets;
    const isNext=!isComplete&&ei===nextExIdx;
    const isOpen=openEx[`${activeDay}-${ei}`]!==false;
    const mistakeKey=`m-${activeDay}-${ei}`;

    // Progression hint from previous session
    const prevEx=(progData[activeDay]||[])[ei];
    let progHint='';
    if(prevEx&&prevEx.weight!=null){
      if(prevEx.hitTop){
        progHint=`<span class="prog-hint inc">↑ Try ${prevEx.weight+5}lb today</span>`;
      } else {
        progHint=`<span class="prog-hint rep">↔ Repeat ${prevEx.weight}lb — build reps first</span>`;
      }
    }

    html+=`<div class="ex-card${isComplete?' ex-complete':''}${isNext?' ex-next':''}">
      <div class="ex-header" onclick="toggleEx(${activeDay},${ei})">
        <div class="ex-circle${isComplete?' done':''}">${checkSVG()}</div>
        <div class="ex-info">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-muscles">${ex.muscles}</div>
          ${progHint}
        </div>
        <div class="ex-right">
          <div class="ex-sets-ct">${exDone}/${ex.sets} sets</div>
        </div>
        ${chevSVG(isOpen)}
      </div>`;

    if(isOpen){
      html+=`<div class="ex-body">
        <div class="ex-body-head">
          ${ex.img ? `<img class="ex-exercise-img" src="${DATASET_IMG_BASE}${ex.img}" alt="${ex.name}" width="88" height="88" loading="lazy" onerror="handleExerciseImageError(this)">` : ''}
          <div class="ex-tip-wrap">
            <div class="ex-tip">${ex.tip}</div>
            <div class="ex-cue">${ex.cue}</div>
          </div>
        </div>
        <span class="mistakes-toggle" onclick="toggleMistakes('${mistakeKey}',event)">Common mistakes ↓</span>
        <div class="mistakes-box" id="${mistakeKey}">${ex.mistakes.split(' · ').map(m=>`• ${m}`).join('<br>')}</div>
        <div class="target-label">Target: ${ex.target} · Rest: ${ex.rest}</div>
        ${renderExerciseAlternatives(ex.name)}
        <div class="col-labels">
          <div class="col-label"></div>
          <div class="col-label">lbs</div>
          <div class="col-label">reps</div>
          <div class="col-label"></div>
        </div>`;
      exData.sets.forEach((s,si)=>{
        html+=`<div class="set-row${s.done?' set-done':''}">
          <div class="set-num">S${si+1}</div>
          <input class="set-input" type="number" inputmode="decimal" min="0" placeholder="—" value="${s.w}" onchange="updateSet(${activeDay},${ei},${si},'w',this.value)" aria-label="Set ${si+1} weight"/>
          <input class="set-input" type="number" inputmode="numeric" min="0" placeholder="—" value="${s.r}" onchange="updateSet(${activeDay},${ei},${si},'r',this.value)" aria-label="Set ${si+1} reps"/>
          <div class="set-tick${s.done?' done':''}" onclick="tickSet(${activeDay},${ei},${si})">${checkSVG()}</div>
        </div>`;
      });
      // Effort selector
      html+=`<div class="effort-row">
        <span class="effort-label">Effort</span>
        ${['easy','medium','hard'].map(e=>`<button class="effort-btn${exData.effort===e?' sel-'+e:''}" onclick="updateEffort(${activeDay},${ei},'${e}')">${e}</button>`).join('')}
      </div>`;
      html+=`</div>`;
    }
    html+=`</div>`;
  });

  // Cardio
  if(day.cardio){
    const cdone=!!cardioState[activeDay];
    html+=`<div class="section-divider">Cardio</div>
    <div class="cardio-row">
      <div class="cardio-info">
        <div class="cardio-name">${day.cardio.name}</div>
        <div class="cardio-desc">${day.cardio.desc}</div>
      </div>
      <div class="cardio-check${cdone?' done':''}" onclick="tickCardio(${activeDay})">${checkSVG()}</div>
    </div>`;
  }

  // Cooldown stretches
  if(day.cooldown){
    const cuItems=day.cooldown.map(s=>{
      const stretchName=stretchNameFromLabel(s);
      if(STRETCH_GUIDE[stretchName]){
        return `<button type="button" class="cooldown-item cooldown-item-btn" onclick='openStretchGuide(${JSON.stringify(stretchName)})'>
          <svg viewBox="0 0 10 10"><polyline points="1,5 4,8 9,2"/></svg>${s}<span class="cooldown-link">How-to</span>
        </button>`;
      }
      return `<div class="cooldown-item"><svg viewBox="0 0 10 10"><polyline points="1,5 4,8 9,2"/></svg>${s}</div>`;
    }).join('');
    html+=`<div class="section-divider">Cool-down</div>
    <div class="cooldown-card">
      <div class="cooldown-title"><svg viewBox="0 0 14 14"><path d="M7 1v12M1 7h12M3 3l8 8M11 3L3 11"/></svg>Cool-down stretches</div>
      <div class="cooldown-grid">${cuItems}</div>
    </div>`;
  }

  html+=`<button class="finish-btn ${allDone?'done-state':'ready'}" onclick="finishSession()" ${allDone?'disabled':''}>
    ${allDone?'✓ Session saved':'Finish & save session'}
  </button>`;

  main.innerHTML=html;
  hiitRefreshUI();
}

// ─── INTERACTIONS ─────────────────────────────────────────────────────────────
function selectDay(i){activeDay=i;initSession(i);renderTabs();renderWorkout();}
function toggleEx(dayIdx,ei){const k=`${dayIdx}-${ei}`;openEx[k]=openEx[k]===false?true:false;renderWorkout();}
function toggleMistakes(id,e){e.stopPropagation();const el=document.getElementById(id);if(el){el.classList.toggle('open');}}
function toggleSubCard(header){
  const body=header.nextElementSibling;
  const chev=header.querySelector('.chev');
  body.classList.toggle('open');
  if(chev) chev.classList.toggle('open');
}
function updateSet(dayIdx,ei,si,field,val){if(!session[dayIdx]) return;session[dayIdx][ei].sets[si][field]=val;}
function tickSet(dayIdx,ei,si){if(!session[dayIdx]) return;session[dayIdx][ei].sets[si].done=!session[dayIdx][ei].sets[si].done;startTimer();renderWorkout();}
function tickCardio(dayIdx){cardioState[dayIdx]=!cardioState[dayIdx];renderWorkout();}
function updateEffort(dayIdx,ei,val){
  if(!session[dayIdx]) return;
  session[dayIdx][ei].effort=session[dayIdx][ei].effort===val?'':val;
  renderWorkout();
}

function finishSession(){
  const day=DAYS[activeDay];
  if(!session[activeDay]) return;
  session[activeDay].forEach(ex=>ex.sets.forEach(s=>s.done=true));
  cardioState[activeDay]=true;

  // Save progression data for each exercise
  progData[activeDay]=session[activeDay].map((ex,ei)=>{
    const exDef=day.exercises[ei];
    const topRep=parseTargetTop(exDef.target);
    const repsEntered=ex.sets.map(s=>parseInt(s.r)).filter(v=>!isNaN(v));
    const hitTop=topRep&&repsEntered.length===ex.sets.length&&repsEntered.every(r=>r>=topRep);
    const weights=ex.sets.map(s=>parseFloat(s.w)).filter(v=>!isNaN(v));
    const avgW=weights.length?Math.round(weights.reduce((a,b)=>a+b,0)/weights.length):null;
    return {name:exDef.name,weight:avgW,hitTop:!!hitTop&&repsEntered.length>0};
  });
  save('gymProg_v1',progData);

  const detail=session[activeDay].map((ex,ei)=>{
    const name=day.exercises[ei].name;
    const sets=ex.sets.map((s,si)=>`S${si+1}: ${s.w||'?'}lb × ${s.r||'?'} reps`).join('  ');
    const effort=ex.effort?` [${ex.effort}]`:'';
    return `${name}: ${sets}${effort}`;
  }).join('\n');
  history.push({
    date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
    ts:Date.now(),
    day:`${day.short} — ${day.label} body`,
    dayIdx:activeDay,
    detail
  });
  save('gymHistory_v3',history);
  syncHistoryEntryToCloud(history[history.length-1]);
  syncProgToCloud();
  timerStart=null;
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  renderWorkout();
}

function clearHistory(){
  if(confirm('Clear all workout history? This cannot be undone.')){
    history=[];save('gymHistory_v3',[]);
    progData={};save('gymProg_v1',{});
    clearHistoryFromCloud();renderHistory();
  }
}

// Flatten all exercises for lookup
const HW_ALL_EXERCISES = HW_PHASES.flatMap(p => p.exercises);

// State: which equipment is selected
let hwEquip = load('hwEquip_v1', {stairs:false, jumprope:false, plyobox:false, dumbbells:false});
let hwOpenCards = {};

function hwToggleEquip(id) {
  hwEquip[id] = !hwEquip[id];
  save('hwEquip_v1', hwEquip);
  renderHome();
}

function hwToggleCard(key) {
  hwOpenCards[key] = !hwOpenCards[key];
  renderHome();
}

function hwToggleMistake(id, e) {
  e.stopPropagation();
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function exAvailable(ex) {
  if (!ex.required || ex.required.length === 0) return true;
  return ex.required.every(r => hwEquip[r]);
}

function renderHome() {
  const main = document.getElementById('page-home');

  // Equipment checklist
  const equipHtml = HW_EQUIPMENT.map(eq => `
    <button class="hw-equip-btn${hwEquip[eq.id] ? ' selected' : ''}" onclick="hwToggleEquip('${eq.id}')">
      <span class="hw-equip-icon">${eq.icon}</span>
      <span class="hw-equip-label">${eq.label}</span>
    </button>
  `).join('');

  // Group exercises by phase, filtering by availability
  const phaseSections = [];
  let lastPhaseLabel = null;
  HW_PHASES.forEach(phase => {
    const available = phase.exercises.filter(ex => exAvailable(ex));
    if (available.length === 0) return;
    phaseSections.push({phase, available});
  });

  let exercisesHtml = '';
  let seenPhase = {};
  phaseSections.forEach(({phase, available}) => {
    // Phase divider (only show once per phase label group)
    if (!seenPhase[phase.label]) {
      seenPhase[phase.label] = true;
      exercisesHtml += `<div class="hw-phase-divider"><div class="hw-phase-divider-inner">${phase.label} &nbsp;·&nbsp; ${phase.weeks}</div></div>`;
    }
    if (available.length > 0) {
      exercisesHtml += `<div class="hw-phase-header">
        <div class="hw-phase-title">${phase.section}</div>
        <div class="hw-phase-badge">${available.length} exercise${available.length !== 1 ? 's' : ''}</div>
      </div>`;
    }
    available.forEach(ex => {
      const key = `hw-${ex.num}`;
      const isOpen = !!hwOpenCards[key];
      const steps = parseHomeHowSteps(ex.how);
      const needsEquip = ex.required.length > 0 ? ex.required.map(r => {
        const eq = HW_EQUIPMENT.find(e => e.id === r);
        return eq ? `<span class="hw-card-equip">${eq.icon} ${eq.label}</span>` : '';
      }).join(' ') : '<span class="hw-card-equip">🏠 Bodyweight</span>';
      const mistakeKey = `hwm-${ex.num}`;

      exercisesHtml += `<div class="hw-card">
        <div class="hw-card-header" onclick="hwToggleCard('${key}')">
          <div class="hw-card-num">${ex.num}</div>
          <div class="hw-card-info">
            <div class="hw-card-name">${ex.name}</div>
            <div class="hw-card-meta">${ex.target}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            ${needsEquip}
            ${chevSVG(isOpen)}
          </div>
        </div>`;

      if (isOpen) {
        exercisesHtml += `<div class="hw-card-body">
          <div class="hw-visual-row">
            <img class="hw-thumb" src="${makeHomeThumb(ex)}" alt="${ex.name} reference diagram" width="92" height="92" loading="lazy">
            <div class="hw-thumb-meta">
              <div class="hw-target-chip">Target: ${ex.target}</div>
              <div class="hw-quick-note">Use this as a form reference before your first rep. Move slowly enough that each checkpoint below stays true.</div>
              <a class="hw-demo-link" href="${makeHomeDemoUrl(ex.name)}" target="_blank" rel="noreferrer noopener">Watch demo search ↗</a>
            </div>
          </div>
          <div class="hw-detail-section">
            <div class="hw-detail-label">How to</div>
            <div class="hw-section-label">Step-by-step</div>
            <ol class="hw-steps">${steps.map(step => `<li>${step}</li>`).join('')}</ol>
          </div>
          <span class="hw-mistake-toggle" onclick="hwToggleMistake('${mistakeKey}', event)">Common mistakes ↓</span>
          <div class="hw-mistake-box" id="${mistakeKey}">${ex.mistakes.split(' · ').map(m => `• ${m}`).join('<br>')}</div>
          <div class="hw-detail-section">
            <div class="hw-detail-label">Watch for</div>
            <div class="hw-watch">${ex.watch}</div>
          </div>
          <div class="hw-detail-section">
            <div class="hw-detail-label">🚩 Red flag</div>
            <div class="hw-redflag">${ex.redflag}</div>
          </div>
        </div>`;
      }
      exercisesHtml += `</div>`;
    });
  });

  const totalAvailable = HW_ALL_EXERCISES.filter(ex => exAvailable(ex)).length;
  const totalLocked = HW_ALL_EXERCISES.length - totalAvailable;

  main.innerHTML = `
    <div class="hw-topline">
      <div class="hist-page-title">At-Home Training</div>
      <div class="hw-ref-badge">Reference only</div>
    </div>
    <div class="hw-intro">A progressive 4-phase plan built for agility, speed, and power — no gym required. Select the equipment you have at home to unlock more exercises.</div>
    <div class="hw-note-card">
      <div class="hw-note-title">How to use this tab</div>
      <div class="hw-note-body">This page is coaching-only, so nothing gets logged here. Tap any exercise to see a quick reference diagram, step-by-step setup cues, common mistakes, and a demo search if you want a moving example before you train.</div>
    </div>

    <div class="hw-equip-title">What do you have at home?</div>
    <div class="hw-equip-grid">${equipHtml}</div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <div class="hw-equip-title" style="margin-bottom:0">Your exercises</div>
      <div style="font-size:12px;font-family:'DM Mono',monospace;color:var(--text-dim)">${totalAvailable} available${totalLocked > 0 ? ` · ${totalLocked} locked` : ''}</div>
    </div>

    ${totalAvailable === 0 ? `<div class="hw-empty">No exercises available yet.<br>All ${HW_ALL_EXERCISES.filter(ex=>ex.required.length===0).length} bodyweight exercises should always appear — tap any card above to check your equipment.</div>` : exercisesHtml}
  `;
}

// ─── INIT ────────────────────────────────────────────────────────────────────
activeDay=todayIdx();
if(DAYS[activeDay].type==='rest') activeDay=DAYS.findIndex(d=>d.type!=='rest');
initSession(activeDay);
renderTabs();
renderWorkout();
updatePageChrome(activePage);
updateSyncBadge();

// Restore Supabase session or show sign-in prompt
initSupabase();
if(sb){
  sb.auth.getSession().then(({data:{session}})=>{
    if(session){
      currentUser=session.user;
      updateSyncBadge();
      loadFromSupabase();
    } else {
      showAuthOverlay();
    }
  });
  // Keep currentUser in sync when auth state changes (e.g. token refresh, sign-out)
  sb.auth.onAuthStateChange((_event, session)=>{
    currentUser=session?session.user:null;
    updateSyncBadge();
  });
}
</script>
</body>
</html>
